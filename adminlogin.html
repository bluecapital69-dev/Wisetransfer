<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · Wise Payment</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #141a22;
    --card-2: #1a222c;
    --border: #232c38;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #00b9ff;
    --danger: #ff5470;
    --radius: 14px;
    --shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 700px at 50% -20%, #16202b 0%, var(--bg) 60%) fixed;
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow);
    animation: rise .35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #0077ff);
    display: grid; place-items: center;
    font-weight: 800; color: #fff; font-size: 22px; letter-spacing: .5px;
    margin: 0 auto 18px;
    box-shadow: 0 10px 24px rgba(0,119,255,.35);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 19px;
    text-align: center;
    letter-spacing: .3px;
  }
  .sub {
    margin: 0 0 24px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: .2px;
  }
  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    background: #0e141b;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,185,255,.12);
  }
  .field input.error {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(255,84,112,.12);
  }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px; }
  .toggle-pw {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .toggle-pw:hover { color: var(--text); background: rgba(255,255,255,.04); }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .row-between label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .row-between input[type="checkbox"] {
    width: 15px; height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  button.submit {
    width: 100%;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .3px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #0077ff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter .15s ease, transform .06s ease;
  }
  button.submit:hover { filter: brightness(1.08); }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: .55; cursor: not-allowed; }

  .msg {
    margin-top: 16px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    min-height: 18px;
    color: var(--danger);
  }
  .msg.info { color: var(--accent); }

  .footer-note {
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="logo">W</div>
    <h1>Admin Access</h1>
    <p class="sub">Sign in to edit the payment page</p>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="admin" autocomplete="username" spellcheck="false" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">👁</button>
      </div>
    </div>

    <div class="row-between">
      <label><input type="checkbox" id="remember" /> Remember me for 7 days</label>
    </div>

    <button type="submit" class="submit" id="loginBtn">Sign in</button>

    <div class="msg" id="msg"></div>

    <p class="footer-note">
      Default credentials: <strong>admin</strong> / <strong>wise2025</strong><br />
      Change these inside <code>adminlogin.html</code> before deploying.
    </p>
  </form>

<script>
(function() {
  // ---- CONFIG: change these before deploying ----
  const VALID_USER = 'admin';
  const VALID_PASS = 'wise2025';
  const MAX_ATTEMPTS = 5;
  const LOCKOUT_MS = 5 * 60 * 1000;   // 5 minutes
  const REMEMBER_MS = 7 * 24 * 60 * 60 * 1000; // 7 days

  const SESSION_KEY = 'wise_admin_session';
  const ATTEMPTS_KEY = 'wise_admin_attempts';
  const LOCKED_UNTIL_KEY = 'wise_admin_locked_until';
  const REMEMBER_KEY = 'wise_admin_remember';

  const $ = id => document.getElementById(id);
  const form = $('loginForm');
  const userInput = $('username');
  const passInput = $('password');
  const rememberBox = $('remember');
  const msg = $('msg');
  const loginBtn = $('loginBtn');
  const togglePw = $('togglePw');

  // If already signed in, skip straight to admin.
  if (sessionStorage.getItem(SESSION_KEY) === 'ok') {
    window.location.replace('admin.html');
    return;
  }
  const rememberUntil = parseInt(localStorage.getItem(REMEMBER_KEY) || '0', 10);
  if (rememberUntil && Date.now() < rememberUntil) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    window.location.replace('admin.html');
    return;
  }

  function setMsg(text, type) {
    msg.textContent = text || '';
    msg.classList.toggle('info', type === 'info');
  }

  function getLockRemaining() {
    const until = parseInt(localStorage.getItem(LOCKED_UNTIL_KEY) || '0', 10);
    const remaining = until - Date.now();
    return remaining > 0 ? remaining : 0;
  }

  function updateLockState() {
    const remaining = getLockRemaining();
    if (remaining > 0) {
      loginBtn.disabled = true;
      const secs = Math.ceil(remaining / 1000);
      setMsg(`Too many attempts. Try again in ${secs}s.`);
      return true;
    }
    loginBtn.disabled = false;
    return false;
  }

  // Live countdown while locked out
  setInterval(() => {
    if (getLockRemaining() > 0) updateLockState();
    else if (loginBtn.disabled) {
      loginBtn.disabled = false;
      setMsg('');
    }
  }, 1000);

  updateLockState();

  // Show / hide password
  togglePw.addEventListener('click', () => {
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    togglePw.textContent = showing ? '👁' : '🙈';
  });

  // Clear error styling on input
  [userInput, passInput].forEach(el => {
    el.addEventListener('input', () => el.classList.remove('error'));
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    if (updateLockState()) return;

    const user = userInput.value.trim();
    const pass = passInput.value;

    userInput.classList.remove('error');
    passInput.classList.remove('error');
    setMsg('');

    if (!user || !pass) {
      if (!user) userInput.classList.add('error');
      if (!pass) passInput.classList.add('error');
      setMsg('Enter both username and password.');
      return;
    }

    if (user === VALID_USER && pass === VALID_PASS) {
      // Success
      sessionStorage.setItem(SESSION_KEY, 'ok');
      sessionStorage.removeItem(ATTEMPTS_KEY);
      localStorage.removeItem(LOCKED_UNTIL_KEY);

      if (rememberBox.checked) {
        localStorage.setItem(REMEMBER_KEY, String(Date.now() + REMEMBER_MS));
      } else {
        localStorage.removeItem(REMEMBER_KEY);
      }

      setMsg('Signed in. Redirecting…', 'info');
      loginBtn.disabled = true;
      setTimeout(() => window.location.replace('admin.html'), 350);
      return;
    }

    // Failure
    const attempts = parseInt(sessionStorage.getItem(ATTEMPTS_KEY) || '0', 10) + 1;
    sessionStorage.setItem(ATTEMPTS_KEY, String(attempts));

    userInput.classList.add('error');
    passInput.classList.add('error');
    passInput.value = '';

    if (attempts >= MAX_ATTEMPTS) {
      localStorage.setItem(LOCKED_UNTIL_KEY, String(Date.now() + LOCKOUT_MS));
      sessionStorage.removeItem(ATTEMPTS_KEY);
      updateLockState();
      return;
    }

    const left = MAX_ATTEMPTS - attempts;
    setMsg(`Invalid credentials. ${left} attempt${left === 1 ? '' : 's'} left.`);
  });
})();
</script>
</body>
</html>
