<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Payment Request · Wise</title>
<style>
  :root{
    --bg1:#0e1b0f; --bg2:#163300;
    --green:#9FE870; --green-d:#7fd14f;
    --forest:#0E1B0F;
    --card:#ffffff;
    --line:#e6ece7;
    --ink:#0f1d10;
    --muted:#6b7c6e;
    --soft:#f4f8f4;
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:radial-gradient(1200px 700px at 50% -20%, var(--bg2), var(--bg1)) fixed;
    color:var(--ink);
    display:grid;
    place-items:center;
    min-height:100dvh;
    padding:12px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; /* prevent scroll */
  }

  .card{
    width:100%;
    max-width:420px;
    max-height:calc(100dvh - 24px);
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
    animation:enter .4s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes enter{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

  /* ---------- Header ---------- */
  .brand{
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{
    display:flex;align-items:center;gap:8px;
    font-weight:800;letter-spacing:-.02em;font-size:15px;
  }
  .logo .mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--green),var(--green-d));
    display:grid;place-items:center;color:var(--forest);
    font-size:12px;font-weight:900;
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:#eaf7ec;color:#0e7c3a;
    font-size:11px;font-weight:700;
    padding:5px 10px;border-radius:999px;
    letter-spacing:.02em;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#1cc76a;box-shadow:0 0 0 3px rgba(28,199,106,.18)}

  /* ---------- Title ---------- */
  .title{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}

  /* ---------- Amount ---------- */
  .amount{
    display:flex;align-items:baseline;justify-content:center;gap:8px;
    padding:10px 0 14px;
    border-bottom:1px dashed var(--line);
  }
  .amount .val{
    font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;
    color:var(--ink);
  }
  .amount .cur{
    font-size:13px;font-weight:800;color:var(--forest);
    background:var(--green);padding:3px 8px;border-radius:999px;
    letter-spacing:.03em;
  }

  /* ---------- Info rows (compact 2-col) ---------- */
  .rows{display:grid;gap:8px;font-size:13px}
  .row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:8px 10px;border-radius:10px;background:var(--soft);
  }
  .row .k{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .row .v{color:var(--ink);font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .row.from{display:block;background:transparent;padding:0}
  .row.from .k{margin-bottom:2px;display:block}
  .row.from .v{text-align:left;max-width:100%;white-space:normal}
  .row.from .email{color:var(--muted);font-size:12px;font-weight:500;margin-top:2px;display:block}

  /* refNote icon alignment */
  #refNote{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
  #refNote svg{flex-shrink:0;opacity:.7}

  /* ---------- Button ---------- */
  .accept{
    margin-top:auto;
    width:100%;
    border:none;border-radius:14px;
    padding:14px 18px;
    font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.01em;
    color:var(--forest);
    background:linear-gradient(135deg,var(--green),var(--green-d));
    box-shadow:0 8px 20px -6px rgba(127,209,79,.55);
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease, box-shadow .15s ease;
  }
  .accept:hover{filter:brightness(1.05);box-shadow:0 10px 24px -6px rgba(127,209,79,.7)}
  .accept:active{transform:translateY(1px) scale(.995)}

  /* ---------- Footer ---------- */
  .foot{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11px;color:var(--muted);font-weight:500;
    padding-top:8px;border-top:1px solid var(--line);
  }
  .foot svg{opacity:.8}

  /* ---------- Short viewports ---------- */
  @media (max-height:640px){
    .card{padding:14px 16px 12px;gap:9px;border-radius:16px}
    .amount .val{font-size:34px}
    .amount{padding:6px 0 10px}
    .row{padding:6px 9px;font-size:12.5px}
    .accept{padding:12px 16px;font-size:14px}
    .rows{gap:6px}
  }
  @media (max-height:540px){
    .amount .val{font-size:28px}
    .title{display:none}
    .foot{padding-top:6px}
  }
</style>
</head>
<body>

<div class="card">

  <!-- Brand row -->
  <div class="brand">
    <div class="logo">
      <span class="mark">W</span>
      <span>Wise</span>
    </div>
    <span class="pill"><span class="dot"></span>Active</span>
  </div>

  <!-- Title -->
  <div class="title">Payment request</div>

  <!-- Amount -->
  <div class="amount">
    <span class="val" id="amountValue">0.00</span>
    <span class="cur" id="currencyCode">USD</span>
  </div>

  <!-- Sender -->
  <div class="row from">
    <span class="k">From</span>
    <span class="v" id="senderName">—</span>
    <span class="email" id="senderEmail">—</span>
  </div>

  <!-- Details -->
  <div class="rows">
    <div class="row">
      <span class="k">Request ID</span>
      <span class="v" id="refNote">—</span>
    </div>
    <div class="row">
      <span class="k">Method</span>
      <span class="v">Wise</span>
    </div>
    <div class="row">
      <span class="k">Purpose</span>
      <span class="v" id="noteValue">—</span>
    </div>
    <div class="row">
      <span class="k">Requested</span>
      <span class="v" id="requestedDate">—</span>
    </div>
  </div>

  <!-- Action -->
  <button class="accept" id="acceptBtn">Accept Payment</button>

  <!-- Footer -->
  <div class="foot">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Secure payment processing
  </div>

</div>

<script>
(function() {
  const STORAGE_KEY = 'wise_payment_data';
  const DEFAULT_DATA = {
    senderName: 'Dave Whitmore',
    senderEmail: 'Davewhitmore76@gmail.com',
    amount: 5050.00,
    currency: 'USD',
    reference: 'WISE-2025-4F2A',
    note: 'Payment to family member'
  };

  function getPaymentData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : { ...DEFAULT_DATA };
    } catch(e) { return { ...DEFAULT_DATA }; }
  }

  const $ = id => document.getElementById(id);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  const setHTML = (id, v) => { const el = $(id); if (el) el.innerHTML = v; };

  function fmtAmount(n) {
    return (parseFloat(n) || 0).toLocaleString('en-US', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
  }

  function fmtDate(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function render() {
    const p = getPaymentData();

    setText('senderName',   p.senderName  || '—');
    setText('senderEmail',  p.senderEmail || '—');
    setText('amountValue',  fmtAmount(p.amount));
    setText('currencyCode', p.currency || 'USD');
    setText('noteValue',    p.note || '—');

    setHTML('refNote', `
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg>
      ${p.reference || DEFAULT_DATA.reference}
    `);

    const stamp = p.requestedAt || p.updatedAt || Date.now();
    setText('requestedDate', fmtDate(stamp));
  }

  render();

  try {
    const bc = new BroadcastChannel('wise_payment');
    bc.onmessage = e => { if (e.data && e.data.type === 'update') render(); };
  } catch(e) {}

  window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) render(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  window.addEventListener('pageshow', e => { if (e.persisted) render(); });

  const acceptBtn = $('acceptBtn');
  if (acceptBtn) acceptBtn.addEventListener('click', () => { window.location.href = 'mtn.html'; });
})();
</script>
</body>
</html>
