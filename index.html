<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wise · Accept Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --wise-green: #9FE870;
    --wise-dark-green: #163300;
    --wise-forest: #0E1B0F;
    --wise-soft-mint: #E8F5E9;
    --wise-light-bg: #F7FBF9;
    --wise-grey: #6B7C6E;
    --wise-border: #DDE5DF;
    --wise-white: #FFFFFF;
    --shadow-lg: 0 20px 40px -12px rgba(22, 51, 0, 0.18);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #F7FBF9 0%, #EDF5F0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    color: var(--wise-forest);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .card-container { max-width: 540px; width: 100%; }

  .payment-card {
    background: var(--wise-white);
    border-radius: 1.75rem;
    box-shadow: var(--shadow-lg);
    padding: 2rem 2rem 1.75rem;
    border: 1px solid rgba(22, 51, 0, 0.04);
    position: relative;
    overflow: hidden;
    animation: cardEnter 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .payment-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--wise-green);
  }

  /* Wise header */
  .wise-header {
    display: flex; align-items: center; gap: 0.85rem;
    margin-bottom: 1.75rem; padding-bottom: 1.35rem;
    border-bottom: 1px solid var(--wise-border);
  }
  .wise-logo {
    background: var(--wise-green);
    width: 46px; height: 46px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(159,232,112,0.35);
    flex-shrink: 0;
  }
  .wise-logo svg { width: 26px; height: 26px; display: block; }
  .wise-title { display: flex; flex-direction: column; gap: 0.15rem; }
  .wise-title .brand {
    font-size: 1.35rem; font-weight: 700;
    letter-spacing: -0.02em; color: var(--wise-forest); line-height: 1.1;
  }
  .wise-title .subtitle { font-size: 0.82rem; font-weight: 500; color: var(--wise-grey); }

  /* Details */
  .payment-details {
    background: var(--wise-light-bg);
    border-radius: 1.25rem;
    padding: 1.5rem;
    margin-bottom: 1.75rem;
    border: 1px solid var(--wise-border);
  }
  .detail-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--wise-border);
  }
  .detail-row:first-child { padding-top: 0.35rem; }
  .detail-row:last-child { border-bottom: none; padding-bottom: 0.35rem; }
  .detail-label {
    font-weight: 500; color: var(--wise-grey); font-size: 0.9rem;
    display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0;
  }
  .detail-label svg {
    width: 16px; height: 16px; stroke: var(--wise-grey); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .detail-value {
    font-weight: 600; color: var(--wise-forest); font-size: 0.98rem;
    text-align: right; word-break: break-word; max-width: 65%;
  }
  .sender-info {
    display: flex; flex-direction: column; gap: 0.2rem; align-items: flex-end;
  }
  .sender-name { font-weight: 600; color: var(--wise-forest); font-size: 1rem; }
  .sender-email { font-size: 0.82rem; color: var(--wise-grey); font-weight: 400; }
  .amount-block {
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem;
  }
  .amount-value {
    font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em;
    color: var(--wise-forest); line-height: 1.1;
  }
  .currency-badge {
    background: var(--wise-soft-mint);
    border-radius: 30px; padding: 0.2rem 0.85rem;
    font-size: 0.78rem; font-weight: 600; color: var(--wise-dark-green);
  }
  .ref-note {
    font-size: 0.78rem; color: var(--wise-grey);
    margin-top: 0.15rem; display: flex; align-items: center;
    gap: 0.3rem; justify-content: flex-end;
  }

  /* Button */
  .accept-btn {
    width: 100%; border: none; border-radius: 2rem;
    padding: 1.15rem 1.5rem;
    font-size: 1.1rem; font-weight: 700; font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 0.65rem;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    letter-spacing: -0.01em;
    background: var(--wise-green);
    color: var(--wise-dark-green);
    box-shadow: 0 6px 18px rgba(159,232,112,0.45);
  }
  .accept-btn:hover:not(:disabled) {
    background: #8FDB5E;
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(159,232,112,0.55);
  }
  .accept-btn:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
  .accept-btn:disabled {
    background: #C8E6B5; color: #7A8F6E;
    box-shadow: none; cursor: not-allowed; opacity: 0.85;
  }
  .accept-btn svg {
    width: 20px; height: 20px; stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }

  .footer-note {
    margin-top: 1.25rem; padding-top: 1.1rem;
    border-top: 1px solid var(--wise-border);
    font-size: 0.76rem; color: var(--wise-grey);
    text-align: center; display: flex; align-items: center;
    justify-content: center; gap: 0.4rem;
  }
  .footer-note svg {
    width: 13px; height: 13px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  @media (max-width: 480px) {
    .payment-card { padding: 1.6rem 1.25rem 1.4rem; border-radius: 1.5rem; }
    .amount-value { font-size: 1.5rem; }
    .accept-btn { font-size: 1rem; padding: 1rem 1.25rem; }
    .detail-value { max-width: 60%; }
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="payment-card" id="wiseCard">
    <div class="wise-header">
      <div class="wise-logo">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M6 5L14 21L11 26L22 8L17 8L12 15L8 5H6Z" fill="#163300" stroke="#163300" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M20 26L26 5" stroke="#163300" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="wise-title">
        <span class="brand">Wise</span>
        <span class="subtitle">Payment request</span>
      </div>
    </div>

    <div class="payment-details">
      <div class="detail-row">
        <div class="detail-label">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Sender
        </div>
        <div class="detail-value sender-info">
          <span class="sender-name" id="senderName">—</span>
          <span class="sender-email" id="senderEmail">—</span>
          <span class="ref-note" id="refNote"></span>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-label">
          <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Amount
        </div>
        <div class="detail-value">
          <div class="amount-block">
            <span class="amount-value" id="amountValue">—</span>
            <span class="currency-badge" id="currencyCode">—</span>
          </div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-label">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Note
        </div>
        <div class="detail-value" id="noteValue" style="font-weight:500;color:#2B4B2E;">—</div>
      </div>
    </div>

    <button class="accept-btn" id="acceptBtn">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Accept payment
    </button>

    <div class="footer-note">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Funds will be credited securely via Wise
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'wise_payment_data';
  const DEFAULT_DATA = {
    senderName: 'Maya Chen',
    senderEmail: 'maya.chen@example.com',
    amount: 1250.00,
    currency: 'USD',
    reference: 'WISE-2025-4F2A',
    note: 'Payment for design services'
  };

  const paymentData = (function(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : { ...DEFAULT_DATA };
    } catch(e) { return { ...DEFAULT_DATA }; }
  })();

  function fmtAmount(n) {
    return (parseFloat(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Render
  document.getElementById('senderName').textContent = paymentData.senderName || '—';
  document.getElementById('senderEmail').textContent = paymentData.senderEmail || '—';
  document.getElementById('amountValue').textContent = fmtAmount(paymentData.amount);
  document.getElementById('currencyCode').textContent = paymentData.currency || 'USD';
  document.getElementById('noteValue').textContent = paymentData.note || '—';
  document.getElementById('refNote').innerHTML = `
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
      <line x1="4" y1="22" x2="4" y2="15"/>
    </svg>
    ${paymentData.reference || DEFAULT_DATA.reference}
  `;

  // Navigate to mtn.html on accept
  document.getElementById('acceptBtn').addEventListener('click', () => {
    window.location.href = 'mtn.html';
  });
})();
</script>
</body>
</html>
